name: Daily US Market Report

# Runs every day at 00:00 UTC == 08:00 Beijing time. The schedule fires on
# weekends and US holidays too; the workflow detects whether there is a fresh
# trading day to report on and exits cleanly when there is none.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate even if today's report file already exists"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build-report:
    name: Fetch data and generate report
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # We will commit back, so use the default GITHUB_TOKEN with write
          # permission (granted via `permissions:` above).
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch market data
        run: |
          python scripts/fetch_market_data.py --output data/latest.json
          echo "--- data/latest.json head ---"
          python -c "import json; d=json.load(open('data/latest.json')); print('report_date:', d.get('report_date')); print('indices:', list(d.get('indices', {}).keys()))"

      - name: Resolve report date and skip-decision
        id: meta
        run: |
          REPORT_DATE=$(python -c "import json; print(json.load(open('data/latest.json')).get('report_date') or '')")
          if [ -z "$REPORT_DATE" ]; then
            echo "report_date is empty -- aborting cleanly."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "report_date=$REPORT_DATE" >> $GITHUB_OUTPUT

          REPORT_PATH="reports/${REPORT_DATE}.md"
          echo "report_path=$REPORT_PATH" >> $GITHUB_OUTPUT

          FORCE="${{ inputs.force }}"
          if [ -f "$REPORT_PATH" ] && [ "$FORCE" != "true" ]; then
            echo "Report already exists for $REPORT_DATE; skipping LLM call."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate LLM credentials
        if: steps.meta.outputs.skip != 'true'
        run: |
          if [ -z "$LLM_PROVIDER" ]; then
            echo "::error::LLM_PROVIDER secret is not set (expected 'openai' or 'anthropic')"
            exit 1
          fi
          if [ "$LLM_PROVIDER" = "openai" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret is required when LLM_PROVIDER=openai"
            exit 1
          fi
          if [ "$LLM_PROVIDER" = "anthropic" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is required when LLM_PROVIDER=anthropic"
            exit 1
          fi

      - name: Generate report
        if: steps.meta.outputs.skip != 'true'
        run: |
          python scripts/generate_report.py \
            --data data/latest.json \
            --prompt prompts/daily_report_prompt.md \
            --output "${{ steps.meta.outputs.report_path }}"

      - name: Commit and push
        if: steps.meta.outputs.skip != 'true'
        run: |
          git config user.name  "meigu-bot[bot]"
          git config user.email "meigu-bot@users.noreply.github.com"
          git add data/latest.json "${{ steps.meta.outputs.report_path }}"
          if git diff --cached --quiet; then
            echo "No staged changes; nothing to commit."
            exit 0
          fi
          git commit -m "report: ${{ steps.meta.outputs.report_date }} (auto)"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: |
            data/latest.json
            reports/
          retention-days: 7
          if-no-files-found: ignore
